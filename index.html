<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Đang bảo trì</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');

  :root {
    --ink: #1b2430;
    --paper: #eef1f4;
    --steel: #5c6b7a;
    --line: #c7d0d9;
    --amber: #e8a13d;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    height: 100%;
  }

  body {
    background: var(--paper);
    background-image:
      linear-gradient(var(--line) 1px, transparent 1px),
      linear-gradient(90deg, var(--line) 1px, transparent 1px);
    background-size: 32px 32px;
    color: var(--ink);
    font-family: 'Space Grotesk', sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }

  .card {
    width: 100%;
    max-width: 640px;
    background: #fff;
    border: 1.5px solid var(--ink);
    box-shadow: 8px 8px 0 var(--ink);
    padding: 48px 40px;
  }

  .tag {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--steel);
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 28px;
  }

  .dot {
    width: 9px;
    height: 9px;
    border-radius: 50%;
    background: var(--amber);
    animation: pulse 1.6s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.4; transform: scale(0.8); }
  }

  .gear {
    width: 56px;
    height: 56px;
    margin-bottom: 20px;
    animation: spin 6s linear infinite;
    transform-origin: center;
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  @media (prefers-reduced-motion: reduce) {
    .gear, .dot { animation: none; }
  }

  h1 {
    font-size: clamp(28px, 5vw, 40px);
    font-weight: 700;
    line-height: 1.15;
    margin-bottom: 16px;
    letter-spacing: -0.01em;
  }

  p {
    color: var(--steel);
    font-size: 16px;
    line-height: 1.6;
    max-width: 46ch;
    margin-bottom: 32px;
  }

  .bar-wrap {
    border: 1px solid var(--ink);
    height: 10px;
    padding: 2px;
    margin-bottom: 12px;
  }

  .bar {
    height: 100%;
    background: repeating-linear-gradient(
      45deg,
      var(--ink),
      var(--ink) 6px,
      var(--amber) 6px,
      var(--amber) 12px
    );
    width: 62%;
    animation: fill 3s ease-in-out infinite alternate;
  }

  @keyframes fill {
    from { width: 45%; }
    to { width: 72%; }
  }

  .meta {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: var(--steel);
    display: flex;
    justify-content: space-between;
    margin-bottom: 36px;
  }

  .footer {
    border-top: 1px solid var(--line);
    padding-top: 24px;
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 16px;
    flex-wrap: wrap;
  }

  .footer span {
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    color: var(--steel);
  }

  .footer a {
    color: var(--ink);
    text-decoration: none;
    border-bottom: 1.5px solid var(--amber);
    font-weight: 500;
  }

  .footer a:hover {
    color: var(--amber);
  }
</style>
</head>
<body>

  <div class="card">
    <div class="tag"><span class="dot"></span> Trạng thái hệ thống</div>

    <svg class="gear" viewBox="0 0 24 24" fill="none" stroke="#1b2430" stroke-width="1.4">
      <circle cx="12" cy="12" r="3.2"/>
      <path d="M12 2v3M12 19v3M22 12h-3M5 12H2M18.4 5.6l-2.1 2.1M7.7 16.3l-2.1 2.1M18.4 18.4l-2.1-2.1M7.7 7.7L5.6 5.6"/>
    </svg>

    <h1>Website đang được bảo trì</h1>
    <p>
      Chúng tôi đang nâng cấp hệ thống để mang lại trải nghiệm tốt hơn.
      Trang sẽ sớm hoạt động trở lại — cảm ơn bạn đã kiên nhẫn chờ đợi.
    </p>

    <div class="bar-wrap"><div class="bar"></div></div>
    <div class="meta">
      <span>TIẾN ĐỘ ƯỚC TÍNH</span>
      <span>DỰ KIẾN HOÀN THÀNH: Trễ</span>
    </div>

    <div class="footer">
      <span>Cần hỗ trợ gấp?</span>
      <a href="mailto:support@example.com">letrancong1708@gmail.com</a>
    </div>
  </div>

</body>
</html>
